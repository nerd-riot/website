<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121A"/>
      <stop offset="100%" stop-color="#080A0F"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container (rounded squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#1E2638" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Geometric Terminal Rebel Prompt: '>' + '!' -->
  <!-- Bold Terminal Chevron '>' on the left -->
  <path d="M 108 144 
           L 236 256 
           L 108 368 
           L 156 368 
           L 284 256 
           L 156 144 Z" 
        fill="#00F59B" 
        filter="url(#subtleGlow)"/>

  <!-- Riot Exclamation / Shard '!' on the right -->
  <!-- Upper angular blade -->
  <polygon points="340,144 388,144 372,284 328,284" fill="#FFFFFF"/>
  <!-- Lower spark dot / square -->
  <polygon points="320,324 372,324 364,368 312,368" fill="#FF5500"/>
</svg>
